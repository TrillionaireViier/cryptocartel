<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);font-family:var(--font-sans)}
.row{display:flex;gap:18px;padding:24px}
.tile{flex:1;display:flex;align-items:center;justify-content:center;height:108px;border-radius:var(--radius-xl);border:1px solid var(--color-hairline)}
.light{background:var(--color-canvas-soft)}
.card{background:var(--color-surface-card)}
.dark{background:var(--color-surface-dark);border-color:var(--color-surface-dark-elevated)}
img{height:30px}
.mark img{height:42px}
</style></head><body>
<div class="row">
  <div class="tile light"><img src="../assets/be-admin-logo.png" alt="Be Admin"/></div>
  <div class="tile card mark"><img src="../assets/be-admin-mark.png" alt="Be Admin mark"/></div>
  <div class="tile dark"><img src="../assets/be-admin-logo-white.png" alt="Be Admin white"/></div>
</div>
</body></html>
