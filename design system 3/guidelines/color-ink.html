<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Action" subtitle="The single CTA color — warm near-black" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);font-family:var(--font-sans)}
.row{display:flex;gap:14px;padding:22px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:62px;border-radius:10px;border:1px solid var(--color-hairline)}
.n{font-size:13px;font-weight:500;color:var(--color-ink)}
.h{font-size:12px;color:var(--color-muted);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-primary)"></div><span class="n">Primary</span><span class="h">#292524</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-primary-active)"></div><span class="n">Primary Active</span><span class="h">#0c0a09</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-ink)"></div><span class="n">Ink</span><span class="h">#0c0a09</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-body-strong)"></div><span class="n">Body Strong</span><span class="h">#292524</span></div>
</div>
</body></html>
