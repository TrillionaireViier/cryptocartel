<!-- @dsCard group="Colors" viewport="700x150" name="Text & Hairlines" subtitle="Body ramp and divider weights" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);font-family:var(--font-sans)}
.row{display:flex;gap:14px;padding:22px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:62px;border-radius:10px;border:1px solid var(--color-hairline)}
.n{font-size:13px;font-weight:500;color:var(--color-ink)}
.h{font-size:12px;color:var(--color-muted);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-body)"></div><span class="n">Body</span><span class="h">#4e4e4e</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-muted)"></div><span class="n">Muted</span><span class="h">#777169</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-muted-soft)"></div><span class="n">Muted Soft</span><span class="h">#a8a29e</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-hairline-strong)"></div><span class="n">Hairline Strong</span><span class="h">#d6d3d1</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-hairline)"></div><span class="n">Hairline</span><span class="h">#e7e5e4</span></div>
</div>
</body></html>
