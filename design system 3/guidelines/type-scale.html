<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Display → caption, full ramp" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);padding:22px 24px;font-family:var(--font-sans)}
.r{display:flex;align-items:baseline;gap:16px;padding:5px 0;border-bottom:1px solid var(--color-hairline-soft)}
.r:last-child{border-bottom:none}
.tok{width:130px;flex:0 0 auto;font-size:12px;color:var(--color-muted);font-variant-numeric:tabular-nums}
.spec{margin-left:auto;font-size:11px;color:var(--color-muted-soft);font-variant-numeric:tabular-nums}
.s{font-family:var(--font-display);font-weight:300;color:var(--color-ink)}
.b{color:var(--color-ink)}
</style></head><body>
<div class="r"><span class="tok">display-mega</span><span class="s" style="font-size:32px;letter-spacing:-1px">Display Mega</span><span class="spec">64 / 300</span></div>
<div class="r"><span class="tok">display-lg</span><span class="s" style="font-size:24px;letter-spacing:-.4px">Section head</span><span class="spec">36 / 300</span></div>
<div class="r"><span class="tok">title-md</span><span class="b" style="font-size:18px;font-weight:500">Component title</span><span class="spec">20 / 500</span></div>
<div class="r"><span class="tok">body-md</span><span class="b" style="font-size:15px;font-weight:400;letter-spacing:.16px">Default body text</span><span class="spec">16 / 400</span></div>
<div class="r"><span class="tok">caption-upper</span><span class="b" style="font-size:11px;font-weight:600;letter-spacing:.96px;text-transform:uppercase">Eyebrow label</span><span class="spec">12 / 600</span></div>
</body></html>
