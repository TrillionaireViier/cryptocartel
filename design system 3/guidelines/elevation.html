<!-- @dsCard group="Brand" viewport="700x170" name="Elevation" subtitle="Hairline + a single soft-drop tier" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);padding:26px;font-family:var(--font-sans)}
.row{display:flex;gap:22px}
.col{display:flex;flex-direction:column;gap:10px;align-items:center}
.card{width:150px;height:78px;background:var(--color-surface-card);border:1px solid var(--color-hairline);border-radius:var(--radius-xl)}
.flat{border-radius:var(--radius-xl);width:150px;height:78px;background:var(--color-canvas);border:1px solid var(--color-hairline)}
.soft{box-shadow:var(--shadow-soft)}
.rest{box-shadow:var(--shadow-card)}
.t{font-size:12px;font-weight:500;color:var(--color-ink)}
.n{font-size:11px;color:var(--color-muted)}
</style></head><body>
<div class="row">
  <div class="col"><div class="flat"></div><span class="t">Flat canvas</span><span class="n">no shadow</span></div>
  <div class="col"><div class="card rest"></div><span class="t">Card — resting</span><span class="n">0 1px 2px /.03</span></div>
  <div class="col"><div class="card soft"></div><span class="t">Card — hover</span><span class="n">0 4px 16px /.04</span></div>
</div>
</body></html>
