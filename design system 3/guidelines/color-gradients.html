<!-- @dsCard group="Colors" viewport="700x160" name="Atmospheric Gradients" subtitle="The signature — pastel orbs, decoration only" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);font-family:var(--font-sans)}
.row{display:flex;gap:14px;padding:22px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:72px;border-radius:50%;}
.mint{background:radial-gradient(circle at 50% 40%,var(--color-gradient-mint),rgba(255,255,255,0) 72%)}
.peach{background:radial-gradient(circle at 50% 40%,var(--color-gradient-peach),rgba(255,255,255,0) 72%)}
.lav{background:radial-gradient(circle at 50% 40%,var(--color-gradient-lavender),rgba(255,255,255,0) 72%)}
.sky{background:radial-gradient(circle at 50% 40%,var(--color-gradient-sky),rgba(255,255,255,0) 72%)}
.rose{background:radial-gradient(circle at 50% 40%,var(--color-gradient-rose),rgba(255,255,255,0) 72%)}
.n{font-size:13px;font-weight:500;color:var(--color-ink);text-align:center}
.h{font-size:12px;color:var(--color-muted);text-align:center;font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip mint"></div><span class="n">Mint</span><span class="h">#a7e5d3</span></div>
  <div class="sw"><div class="chip peach"></div><span class="n">Peach</span><span class="h">#f4c5a8</span></div>
  <div class="sw"><div class="chip lav"></div><span class="n">Lavender</span><span class="h">#c8b8e0</span></div>
  <div class="sw"><div class="chip sky"></div><span class="n">Sky</span><span class="h">#a8c8e8</span></div>
  <div class="sw"><div class="chip rose"></div><span class="n">Rose</span><span class="h">#e8b8c4</span></div>
</div>
</body></html>
