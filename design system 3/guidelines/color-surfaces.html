<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Off-white canvas, white cards, dark band" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);font-family:var(--font-sans)}
.row{display:flex;gap:14px;padding:22px}
.sw{flex:1;display:flex;flex-direction:column;gap:8px}
.chip{height:62px;border-radius:10px;border:1px solid var(--color-hairline)}
.n{font-size:13px;font-weight:500;color:var(--color-ink)}
.h{font-size:12px;color:var(--color-muted);font-variant-numeric:tabular-nums}
</style></head><body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--color-canvas)"></div><span class="n">Canvas</span><span class="h">#f5f5f5</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-canvas-soft)"></div><span class="n">Canvas Soft</span><span class="h">#fafafa</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-card)"></div><span class="n">Surface Card</span><span class="h">#ffffff</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-strong)"></div><span class="n">Surface Strong</span><span class="h">#f0efed</span></div>
  <div class="sw"><div class="chip" style="background:var(--color-surface-dark)"></div><span class="n">Surface Dark</span><span class="h">#0c0a09</span></div>
</div>
</body></html>
