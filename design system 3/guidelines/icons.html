<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:10px;padding:22px}
.cell{display:flex;flex-direction:column;align-items:center;gap:8px}
.plate{width:52px;height:52px;border-radius:var(--radius-lg);background:var(--color-surface-card);border:1px solid var(--color-hairline);display:flex;align-items:center;justify-content:center}
.plate img{width:24px;height:24px}
.lbl{font-size:10px;color:var(--color-muted);letter-spacing:.02em}
</style></head><body>
<div class="grid">
  <div class="cell"><div class="plate"><img src="../assets/icons/home.png" alt="home"/></div><span class="lbl">home</span></div>
