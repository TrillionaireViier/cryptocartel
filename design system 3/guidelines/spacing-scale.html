<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base unit, 96px section rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);padding:24px;font-family:var(--font-sans)}
.row{display:flex;align-items:flex-end;gap:18px}
.col{display:flex;flex-direction:column;align-items:center;gap:8px}
.bar{background:var(--color-primary);border-radius:3px;width:22px}
.n{font-size:11px;color:var(--color-muted);font-variant-numeric:tabular-nums}
.t{font-size:11px;font-weight:500;color:var(--color-ink)}
</style></head><body>
<div class="row">
  <div class="col"><div class="bar" style="height:8px"></div><span class="t">xs</span><span class="n">8</span></div>
  <div class="col"><div class="bar" style="height:12px"></div><span class="t">sm</span><span class="n">12</span></div>
  <div class="col"><div class="bar" style="height:16px"></div><span class="t">base</span><span class="n">16</span></div>
  <div class="col"><div class="bar" style="height:24px"></div><span class="t">lg</span><span class="n">24</span></div>
  <div class="col"><div class="bar" style="height:32px"></div><span class="t">xl</span><span class="n">32</span></div>
  <div class="col"><div class="bar" style="height:48px"></div><span class="t">xxl</span><span class="n">48</span></div>
  <div class="col"><div class="bar" style="height:72px"></div><span class="t">section</span><span class="n">96</span></div>
</div>
</body></html>
