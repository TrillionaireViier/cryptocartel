<!DOCTYPE html><html><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
body{margin:0;background:var(--color-canvas);padding:24px;font-family:var(--font-sans)}

.body{font-size:16px;font-weight:400;line-height:1.5;letter-spacing:0.16px;color:var(--color-body);margin:0 0 12px;max-width:560px}

<p class="title">Title — Inter Medium 20/500</p>
<p class="body">Body copy runs Inter at 400 with +0.16px tracking — slightly looser than default Inter for a quietly editorial feel that pairs with the serif display.</p>
